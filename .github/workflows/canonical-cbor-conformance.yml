name: Media kernel canonical CBOR conformance

on:
  pull_request:
    branches:
      - planning/media-kernel
  workflow_dispatch:

jobs:
  cbor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin dev-2026-08
        run: |
          curl -fsSL https://github.com/odin-lang/Odin/releases/download/dev-2026-08/odin-linux-amd64-dev-2026-08.tar.gz -o /tmp/odin.tar.gz
          mkdir -p /tmp/odin-dist
          tar -C /tmp/odin-dist -xzf /tmp/odin.tar.gz
          ODIN_BIN="$(find /tmp/odin-dist -type f -name odin -perm -111 | head -1)"
          test -n "$ODIN_BIN"
          echo "$(dirname "$ODIN_BIN")" >> "$GITHUB_PATH"

      - name: Build independent Odin encoder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canonical-cbor-build
          odin check research/kernel-canonical-cbor-v0/main.odin -file
          odin build research/kernel-canonical-cbor-v0/main.odin -file -o:speed \
            -out:"$PWD/canonical-cbor-build/odin-cbor"

      - name: Compare Python and Odin bytes/hash
        shell: bash
        run: |
          set -euo pipefail
          python3 research/kernel-canonical-cbor-v0/verify.py \
            canonical-cbor-build/odin-cbor | tee canonical-cbor.log

      - name: AddressSanitizer Odin encoder
        shell: bash
        run: |
          set -euo pipefail
          odin build research/kernel-canonical-cbor-v0/main.odin -file -o:speed -sanitize:address \
            -out:"$PWD/canonical-cbor-build/odin-cbor-asan"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            canonical-cbor-build/odin-cbor-asan | tee canonical-cbor-asan.log

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: media-kernel-canonical-cbor-v0
          path: |
            canonical-cbor-python.json
            canonical-cbor-conformance.json
            canonical-cbor.log
            canonical-cbor-asan.log
            research/kernel-canonical-cbor-v0/reference.py
            research/kernel-canonical-cbor-v0/main.odin
            research/kernel-canonical-cbor-v0/verify.py

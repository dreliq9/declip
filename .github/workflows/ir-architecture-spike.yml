name: Media kernel IR architecture spike

on:
  pull_request:
    branches:
      - planning/media-kernel
  workflow_dispatch:

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin dev-2026-08
        run: |
          curl -fsSL https://github.com/odin-lang/Odin/releases/download/dev-2026-08/odin-linux-amd64-dev-2026-08.tar.gz -o /tmp/odin.tar.gz
          mkdir -p /tmp/odin-dist
          tar -C /tmp/odin-dist -xzf /tmp/odin.tar.gz
          ODIN_BIN="$(find /tmp/odin-dist -type f -name odin -perm -111 | head -1)"
          test -n "$ODIN_BIN"
          echo "$(dirname "$ODIN_BIN")" >> "$GITHUB_PATH"

      - name: Build architecture spike
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ir-spike-build
          odin check research/kernel-ir-architecture-spike
          odin build research/kernel-ir-architecture-spike -o:speed \
            -out:"$PWD/ir-spike-build/ir-spike"
          strip --strip-unneeded ir-spike-build/ir-spike
          ls -l ir-spike-build/ir-spike | tee ir-spike-binary.txt

      - name: Run semantic and lowering comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 research/kernel-ir-architecture-spike/verify.py \
            ir-spike-build/ir-spike \
            research/kernel-ir-architecture-spike/main.odin | tee ir-spike.log

      - name: AddressSanitizer smoke
        shell: bash
        run: |
          set -euo pipefail
          odin build research/kernel-ir-architecture-spike -o:speed -sanitize:address \
            -out:"$PWD/ir-spike-build/ir-spike-asan"
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
            ir-spike-build/ir-spike-asan | tee ir-spike-asan.log

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: media-kernel-ir-architecture-spike
          path: |
            ir-architecture-results.json
            ir-spike.log
            ir-spike-asan.log
            ir-spike-binary.txt
            research/kernel-ir-architecture-spike/README.md
            research/kernel-ir-architecture-spike/main.odin
            research/kernel-ir-architecture-spike/verify.py
